name: khanya_pos
description: Khanya Resources cross-platform point-of-sale client for mobile, tablet, and Windows.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.0.1
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.7
  pdf: ^3.13.1
  printing: ^5.15.1
  windows_printer: ^0.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true
  assets:
    - assets/branding/khanya_app_icon_safe.jpg

flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/branding/khanya_app_icon_safe.jpg
  min_sdk_android: 21
  remove_alpha_ios: true
  windows:
    generate: true
    image_path: assets/branding/khanya_app_icon_safe.jpg
    icon_size: 256

flutter_native_splash:
  color: "#F4F7F2"
  image: assets/branding/khanya_app_icon_safe.jpg
  android_12:
    color: "#F4F7F2"
    image: assets/branding/khanya_app_icon_safe.jpg
  web: true

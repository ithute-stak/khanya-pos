name: khanya_pos
description: Khanya Resources cross-platform point-of-sale client for mobile, tablet, and Windows.
publish_to: "none"
version: 0.4.0+4

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  equatable: ^3.0.0
  go_router: ^18.0.1
  dio: ^5.11.1
  drift: ^2.35.0
  drift_flutter: ^0.3.1
  connectivity_plus: ^7.3.1
  web_socket_channel: ^3.0.3
  flutter_secure_storage: ^11.2.0
  uuid: ^4.6.0
  image_picker: ^1.2.3
  file_picker: ^13.1.0
  path_provider: ^2.1.6
  crypto: ^3.0.7

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.16.1
  drift_dev: ^2.35.0

flutter:
  uses-material-design: true
  assets:
    - assets/branding/khanya_resources_corporate.webp
    - assets/branding/khanya_resources_vertical.webp
    - assets/branding/khanya_resources_horizontal.webp

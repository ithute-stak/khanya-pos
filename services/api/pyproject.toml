[project]
name = "khanya-pos-api"
version = "0.1.0"
description = "Khanya POS multi-tenant FastAPI backend"
requires-python = ">=3.13,<3.15"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy==2.0.54",
  "psycopg[binary]>=3.2,<4",
  "redis==8.1.0",
  "pydantic-settings>=2.7,<3",
  "alembic>=1.14,<2",
  "pyjwt[crypto]>=2.10,<3",
  "pwdlib[argon2]>=0.2,<1",
]

[project.optional-dependencies]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.25,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"

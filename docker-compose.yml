services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: khanya
      POSTGRES_USER: khanya
      POSTGRES_PASSWORD: khanya
    ports:
      - "5432:5432"
    volumes:
      - khanya_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U khanya -d khanya"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - khanya_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${OBJECT_STORAGE_ACCESS_KEY:-khanya}
      MINIO_ROOT_PASSWORD: ${OBJECT_STORAGE_SECRET_KEY:-khanya-development-only}
    command: ["server", "/data", "--console-address", ":9001"]
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - khanya_minio:/data

  api:
    build:
      context: ./services/api
    env_file:
      - .env
    ports:
      - "8009:8009"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    volumes:
      - ./services/api:/app
    command: ["sh", "-c", "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8009 --reload"]

  outbox-worker:
    build:
      context: ./services/api
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./services/api:/app
    command: ["sh", "-c", "alembic upgrade head && python -m app.workers.outbox"]

volumes:
  khanya_postgres:
  khanya_redis:
  khanya_minio:

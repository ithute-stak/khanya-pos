name: Khanya Release Images

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]

concurrency:
  group: khanya-release-images
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: Publish tested API + Web images
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/khanya-pos-api
      WEB_IMAGE: ghcr.io/${{ github.repository_owner }}/khanya-pos-web

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@v5
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Publish Khanya API image
        uses: docker/build-push-action@v6
        with:
          context: services/api
          file: services/api/Dockerfile
          push: true
          tags: |
            ${{ env.API_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.API_IMAGE }}:main

      - name: Publish Khanya Web image
        uses: docker/build-push-action@v6
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ${{ env.WEB_IMAGE }}:${{ env.RELEASE_SHA }}
            ${{ env.WEB_IMAGE }}:main

      - name: Verify both published images
        run: |
          docker buildx imagetools inspect "${API_IMAGE}:${RELEASE_SHA}"
          docker buildx imagetools inspect "${WEB_IMAGE}:${RELEASE_SHA}"

      - name: Release summary
        run: |
          echo "Khanya image published only; production VPS is unchanged."
          echo "API: ${API_IMAGE}:${RELEASE_SHA}"
          echo "WEB: ${WEB_IMAGE}:${RELEASE_SHA}"
          echo "The VPS must pull the tested immutable image explicitly."

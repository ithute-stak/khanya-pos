name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    name: FastAPI
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: khanya
          POSTGRES_USER: khanya
          POSTGRES_PASSWORD: khanya
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U khanya -d khanya"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://khanya:khanya@localhost:5432/khanya
      REDIS_URL: redis://localhost:6379/0
      JWT_SECRET: ci-only-secret-not-for-production
    defaults:
      run:
        working-directory: services/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: services/api/pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Compile
        run: python -m compileall app alembic
      - name: Apply migrations
        run: alembic upgrade head
      - name: Verify schema matches models
        run: alembic check
      - name: Unit tests
        run: pytest -q
      - name: Financial database integration tests
        env:
          RUN_INTEGRATION_TESTS: "1"
        run: >-
          pytest -q
          tests/test_sale_service_integration.py
          tests/test_purchase_service_integration.py
          tests/test_supplier_payment_integration.py
          tests/test_accounting_service_integration.py
          tests/test_customer_credit_integration.py
          tests/test_receivables_reconciliation_integration.py

  mobile:
    name: Flutter
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Install dependencies
        run: flutter pub get
      - name: Generate Drift code
        run: dart run build_runner build
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
